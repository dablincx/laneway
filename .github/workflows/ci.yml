name: ci

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: laneway
          POSTGRES_PASSWORD: laneway
          POSTGRES_DB: laneway
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U laneway" --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      # Test-only database in the service container above.
      DATABASE_URL: postgres://laneway:laneway@localhost:5432/laneway
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest,sqlx-cli
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo nextest run --workspace --locked --no-tests=pass
      - name: env var docs + .env.example up to date
        run: cargo run -q -p laneway-server -- config docs --check
      - name: sqlx offline query data up to date
        run: cargo sqlx prepare --workspace --check -- --all-targets
      - name: OpenAPI spec up to date
        run: cargo run -q -p laneway-server -- openapi | diff - web/openapi.json
      - name: translations (laneway i18n check)
        if: matrix.arch == 'amd64'
        run: cargo run -q -p laneway-server -- i18n check

  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: API client matches the spec
        run: pnpm gen:api && git diff --exit-code src/api/schema.ts
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          load: true
          tags: laneway:ci
          cache-from: type=gha,scope=ci-amd64
          cache-to: type=gha,mode=max,scope=ci-amd64
      - name: smoke test
        run: bash scripts/smoke-test.sh laneway:ci

  dev-container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: docker
          file: docker/dev.Dockerfile
          cache-from: type=gha,scope=dev-container
          cache-to: type=gha,mode=max,scope=dev-container
