[package]
name = "laneway-core"
description = "laneway: domain services, permission resolver and actions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.11.1"
base64 = "0.22.1"
chrono = "0.4.45"
hkdf = "0.12.4"
laneway-auth.workspace = true
laneway-config.workspace = true
laneway-db.workspace = true
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "macros", "uuid", "chrono"] }
thiserror = "2.0.21"
tracing = "0.1.44"
uuid = "1.29.2"

[lints]
workspace = true

[dev-dependencies]
proptest = "1.12.0"
sqlx = { version = "0.8.6", default-features = false, features = ["postgres", "macros", "migrate", "runtime-tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }
