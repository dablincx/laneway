# git-cliff changelog config. Generated from Conventional Commits by the release workflow.

[changelog]
header = """
# Changelog

All notable changes to laneway. Generated from the commit history, see CONTRIBUTING.md.

"""
body = """
{% if version %}\
## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }})
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for scope, scoped in commits | filter(attribute="scope") | group_by(attribute="scope") %}
#### {{ scope }}
{% for commit in scoped %}
- {{ commit.message }}{% if commit.breaking %} (**breaking**){% endif %}\
{% endfor %}
{% endfor %}\
{% if commits | length > commits | filter(attribute="scope") | length %}
#### general
{% for commit in commits %}{% if not commit.scope %}
- {{ commit.message }}{% if commit.breaking %} (**breaking**){% endif %}\
{% endif %}{% endfor %}
{% endif %}\
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9].*"
sort_commits = "oldest"
# The changelog is for people running laneway: only changes to the app itself.
# Internal scopes (CI, tests, dev tooling, contributor docs, Claude rules) are left out.
commit_parsers = [
  { message = "^[a-z]+\\((ci|e2e|dev|claude|contributing|changelog)\\)", skip = true },
  { message = "^build\\((docker|deps)\\)", group = "<!-- 6 -->Build" },
  { message = "^build", skip = true },
  { message = "^bump", skip = true },
  { message = "^changelog", skip = true },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^style", skip = true },
  { message = "^test", skip = true },
  { body = ".*BREAKING CHANGE.*", group = "<!-- 0 -->Breaking changes" },
  { message = "^feat", group = "<!-- 1 -->Features" },
  { message = "^fix", group = "<!-- 2 -->Bug fixes" },
  { message = "^perf", group = "<!-- 3 -->Performance" },
  { message = "^refactor", group = "<!-- 4 -->Refactoring" },
  { message = "^docs", group = "<!-- 5 -->Documentation" },
  { message = "^revert", group = "<!-- 7 -->Reverts" },
]
