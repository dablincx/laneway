[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.3"
edition = "2024"
rust-version = "1.90"
license = "GPL-3.0-or-later"
repository = "https://github.com/dablincx/laneway"
authors = ["laneway contributors"]
publish = false

[workspace.dependencies]
laneway-auth = { path = "crates/auth" }
laneway-config = { path = "crates/config" }
laneway-core = { path = "crates/core" }
laneway-db = { path = "crates/db" }
laneway-jobs = { path = "crates/jobs" }
laneway-i18n = { path = "crates/i18n" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
# PATCH bodies need three states: leave as is (None), clear (Some(None)), set (Some(Some(x))).
option_option = "allow"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
