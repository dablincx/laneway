# Throwaway services for tests (CI and ./dev.sh test). Nothing is persisted.
name: laneway-test

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: laneway
      POSTGRES_PASSWORD: laneway
      POSTGRES_DB: laneway
    tmpfs:
      - /var/lib/postgresql
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U laneway"]
      interval: 1s
      timeout: 3s
      retries: 30
